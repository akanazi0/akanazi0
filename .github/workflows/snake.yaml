name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: akanazi0
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#d79921&color_dots=#ebdbb2,#fabd2f,#fe8019,#d65d0e,#af3a03
            dist/github-contribution-grid-snake-dark.svg?color_snake=#fabd2f&color_dots=#282828,#7c6f64,#d79921,#fe8019,#d65d0e

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
